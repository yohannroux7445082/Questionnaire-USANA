<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Questionnaire Santé USANA — Confort, Tonus & Nutrition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#0D1B2A;
    --surface:#142639;
    --surface-2:#1B3350;
    --gold:#C9A227;
    --gold-soft:#E4C766;
    --ice:#8FD9E8;
    --text:#F2EDE3;
    --muted:#8FA0B5;
    --line:rgba(242,237,227,0.12);
    --danger:#D97757;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse 900px 500px at 50% -10%, rgba(201,162,39,0.10), transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .app{
    max-width:640px;
    margin:0 auto;
    padding:28px 20px 80px;
  }
  /* ---------- Header + Ridge progress (signature element) ---------- */
  .brand{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    margin-bottom:22px;
    flex-wrap:wrap;
  }
  .brand-name{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:17px;
    letter-spacing:0.01em;
    color:var(--gold-soft);
    line-height:1.25;
  }
  .brand-tag{
    font-family:'Space Mono',monospace;
    font-size:10px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--muted);
  }
  .ridge-wrap{
    position:relative;
    height:54px;
    margin-bottom:8px;
  }
  .ridge-wrap svg{width:100%;height:100%;display:block;}
  #ridgeFill{transition:stroke-dashoffset 0.6s cubic-bezier(.65,0,.35,1);}
  .step-label{
    font-family:'Space Mono',monospace;
    font-size:11px;
    color:var(--muted);
    letter-spacing:0.08em;
    text-transform:uppercase;
    margin-bottom:28px;
  }
  .step-label b{color:var(--gold-soft);font-weight:700;}

  /* ---------- Cards / steps ---------- */
  .card{
    background:linear-gradient(180deg, var(--surface), var(--surface-2));
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:30px 26px;
    animation:rise 0.45s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes rise{
    from{opacity:0; transform:translateY(14px);}
    to{opacity:1; transform:translateY(0);}
  }
  h1.step-title{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:26px;
    line-height:1.25;
    margin:0 0 8px;
    color:var(--text);
  }
  p.step-sub{
    color:var(--muted);
    font-size:14.5px;
    line-height:1.55;
    margin:0 0 26px;
  }
  label.field-label{
    display:block;
    font-size:13px;
    color:var(--gold-soft);
    margin-bottom:8px;
    font-weight:600;
  }
  input[type=text], input[type=email], input[type=tel]{
    width:100%;
    background:rgba(0,0,0,0.18);
    border:1px solid var(--line);
    border-radius:10px;
    padding:13px 14px;
    color:var(--text);
    font-size:15px;
    font-family:'Inter',sans-serif;
    margin-bottom:18px;
    outline:none;
    transition:border-color .2s;
  }
  input:focus{border-color:var(--gold);}
  input::placeholder{color:#5C6E82;}

  .choice-grid{display:flex; flex-direction:column; gap:10px; margin-bottom:6px;}
  .choice{
    display:flex; align-items:center; gap:12px;
    background:rgba(0,0,0,0.16);
    border:1px solid var(--line);
    border-radius:10px;
    padding:14px 16px;
    cursor:pointer;
    transition:border-color .15s, background .15s, transform .1s;
    font-size:15px;
  }
  .choice:hover{border-color:rgba(201,162,39,0.5);}
  .choice.selected{
    border-color:var(--gold);
    background:rgba(201,162,39,0.12);
  }
  .choice .dot{
    width:16px;height:16px;border-radius:50%;
    border:2px solid var(--muted);
    flex:0 0 16px;
    position:relative;
  }
  .choice.selected .dot{border-color:var(--gold);}
  .choice.selected .dot::after{
    content:'';position:absolute;inset:3px;border-radius:50%;background:var(--gold);
  }
  .choice.multi .dot{border-radius:5px;}
  .choice.multi.selected .dot::after{border-radius:2px;}

  textarea.other-input{
    width:100%;
    background:rgba(0,0,0,0.18);
    border:1px solid var(--line);
    border-radius:10px;
    padding:10px 12px;
    color:var(--text);
    font-family:'Inter',sans-serif;
    font-size:14px;
    margin-top:8px;
    resize:none;
    outline:none;
  }
  textarea.other-input:focus{border-color:var(--gold);}

  /* ---------- Scale grid (auto-évaluation) ---------- */
  .scale-list{display:flex; flex-direction:column; gap:20px;}
  .scale-item .scale-top{
    display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px;
  }
  .scale-item .scale-name{font-size:14.5px; font-weight:600;}
  .scale-item .scale-value{
    font-family:'Space Mono',monospace; font-size:14px; color:var(--gold-soft);
    min-width:24px; text-align:right;
  }
  input[type=range]{
    -webkit-appearance:none; width:100%; height:6px; border-radius:4px;
    background:linear-gradient(90deg, var(--danger), var(--gold) 50%, var(--ice));
    outline:none; cursor:pointer;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; width:20px; height:20px; border-radius:50%;
    background:var(--text); border:3px solid var(--gold);
    cursor:pointer; margin-top:-7px;
  }
  input[type=range]::-moz-range-thumb{
    width:20px; height:20px; border-radius:50%;
    background:var(--text); border:3px solid var(--gold); cursor:pointer;
  }
  .scale-poles{
    display:flex; justify-content:space-between;
    font-size:10.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; margin-top:4px;
  }

  /* ---------- Buttons ---------- */
  .nav-row{
    display:flex; justify-content:space-between; align-items:center;
    margin-top:28px;
  }
  button{
    font-family:'Inter',sans-serif; font-weight:600; font-size:14.5px;
    border-radius:10px; padding:13px 22px; cursor:pointer; border:none;
    transition:transform .1s, opacity .15s;
  }
  button:active{transform:scale(0.97);}
  .btn-primary{
    background:var(--gold); color:#1A1305;
  }
  .btn-primary:hover{background:var(--gold-soft);}
  .btn-primary:disabled{opacity:0.35; cursor:not-allowed;}
  .btn-ghost{
    background:transparent; color:var(--muted); padding:13px 8px;
  }
  .btn-ghost:hover{color:var(--text);}

  /* ---------- Results ---------- */
  .result-hero{
    text-align:center; padding:6px 0 18px;
  }
  .result-hero .glyph{font-size:34px; margin-bottom:10px;}
  .result-hero h1{margin-bottom:6px;}
  .score-summary{
    display:grid; grid-template-columns:repeat(2,1fr); gap:10px;
    margin:20px 0;
  }
  .score-chip{
    background:rgba(0,0,0,0.18); border:1px solid var(--line); border-radius:10px;
    padding:12px 14px;
  }
  .score-chip .cat{font-size:12.5px; color:var(--muted); margin-bottom:4px;}
  .score-chip .val{font-family:'Space Mono',monospace; font-size:18px; font-weight:700;}
  .score-chip.low .val{color:var(--danger);}
  .score-chip.high .val{color:var(--ice);}

  .analysis-block{
    background:rgba(0,0,0,0.15); border:1px solid var(--line); border-radius:12px;
    padding:20px; margin-top:18px; white-space:pre-wrap; font-size:14px; line-height:1.7;
    max-height:340px; overflow-y:auto;
  }
  .status-msg{
    margin-top:16px; font-size:13.5px; text-align:center; color:var(--muted); min-height:20px;
  }
  .status-msg.ok{color:var(--ice);}
  .status-msg.err{color:var(--danger);}

  ::-webkit-scrollbar{width:6px;}
  ::-webkit-scrollbar-thumb{background:var(--line); border-radius:4px;}

  @media (max-width:480px){
    .card{padding:24px 18px;}
    h1.step-title{font-size:22px;}
    .score-summary{grid-template-columns:1fr 1fr;}
  }

  .btn-secondary{
    background:transparent; color:var(--gold-soft); border:1px solid var(--gold);
  }
  .btn-secondary:hover{background:rgba(201,162,39,0.12);}
  .result-actions{display:flex; gap:10px; flex-wrap:wrap; margin-top:18px;}
  .result-actions button{flex:1; min-width:160px;}

  /* ---------- Impression / export PDF ---------- */
  @media print{
    body{background:#fff !important; color:#111 !important;}
    .brand, .ridge-wrap, .step-label, .nav-row, .status-msg, .result-actions{display:none !important;}
    .app{max-width:100%; padding:0;}
    .card{
      background:#fff !important; border:none !important; box-shadow:none !important; padding:0 !important;
      animation:none !important;
    }
    .result-hero{text-align:left;}
    .result-hero .glyph{display:none;}
    h1.step-title, .scale-name, .cat, .score-chip .val{color:#111 !important;}
    p.step-sub{color:#444 !important;}
    .score-chip{background:#f4f4f4 !important; border:1px solid #ddd !important;}
    .score-chip.low .val{color:#B3492E !important;}
    .score-chip.high .val{color:#1D6E7C !important;}
    .analysis-block{
      background:#fff !important; border:1px solid #ddd !important; color:#111 !important;
      max-height:none !important; overflow:visible !important;
    }
  }
</style>
</head>

const ridgeLen = 900;
function setProgress(n){
  document.getElementById('stepNow').textContent = n;

  document.getElementById('ridgeFill').style.strokeDashoffset = Math.max(0, ridgeLen - ridgeLen*pct);

  setProgress(Math.min(stepIndex+1, TOTAL_STEPS));

}

function slug(s){ return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,'_'); }

function isStep0Valid(){
  const base = state.nom.trim() && state.age.trim() && state.email.trim() && state.metier.trim() && state.whatsapp.trim() && state.referent.trim() && state.traitement && state.genre;
  if(!base) return false;
  if(state.traitement === "Oui" && !state.traitementDetail.trim()) return false;
  return true;
}

function wireStep(i){
  if(i===0){
    const nextBtn = () => document.getElementById('btnNext');
    const refreshValidity = () => {
      const btn = nextBtn();
      if(btn) btn.disabled = !isStep0Valid();
    };
    document.getElementById('f_nom').oninput = e => { state.nom = e.target.value; refreshValidity(); };
    document.getElementById('f_age').oninput = e => { state.age = e.target.value; refreshValidity(); };
    document.getElementById('f_email').oninput = e => { state.email = e.target.value; refreshValidity(); };
    document.getElementById('f_metier').oninput = e => { state.metier = e.target.value; refreshValidity(); };
    document.getElementById('f_whatsapp').oninput = e => { state.whatsapp = e.target.value; refreshValidity(); };
    const fr = document.getElementById('f_referent');
    if(fr) fr.oninput = e => { state.referent = e.target.value; refreshValidity(); };
    document.querySelectorAll('#choiceTraitement .choice').forEach(el=>{
      el.onclick = () => {
        state.traitement = el.dataset.val;
        if(state.traitement === "Non") state.traitementDetail = "";
        goTo(i);
      };
    });
    const td = document.getElementById('traitementDetailText');
    if(td) td.oninput = e => { state.traitementDetail = e.target.value; refreshValidity(); };
    document.querySelectorAll('#choiceGenre .choice').forEach(el=>{
      el.onclick = () => {
        state.genre = el.dataset.val;
        if(state.genre !== "Femme") state.phaseFemme = "";
        if(state.genre !== "Homme") state.phaseHomme = "";
        goTo(i);
      };
    });
  }
  if(i===1){
    document.querySelectorAll('#choiceImportance .choice').forEach(el=>{
      el.onclick = () => { state.importance = el.dataset.val; goTo(i); };
    });
  }
  if(i===2){
    const phaseEls = document.querySelectorAll('#choicePhaseFemme .choice');
    if(phaseEls) phaseEls.forEach(el=>{
      el.onclick = () => { state.phaseFemme = el.dataset.val; goTo(i); };
    });
    const pfo = document.getElementById('phaseFemmeOtherText');
    if(pfo) pfo.oninput = e => { state.phaseFemmeOther = e.target.value; };
    const phaseElsH = document.querySelectorAll('#choicePhaseHomme .choice');
    if(phaseElsH) phaseElsH.forEach(el=>{
      el.onclick = () => { state.phaseHomme = el.dataset.val; goTo(i); };
    });
    const pho = document.getElementById('phaseHommeOtherText');
    if(pho) pho.oninput = e => { state.phaseHommeOther = e.target.value; };
  }
  if(i===3){
    document.querySelectorAll('.scaleInput').forEach(inp=>{
      inp.oninput = () => {
        state.scores[inp.dataset.item] = parseInt(inp.value);
        document.getElementById('val_'+slug(inp.dataset.item)).textContent = inp.value;
      };
    });
    document.querySelectorAll('#choiceHumeurType .choice').forEach(el=>{
      el.onclick = () => { state.humeurType = el.dataset.val; goTo(i); };
    });
  }
  if(i===4){
    document.querySelectorAll('#choiceKnow .choice').forEach(el=>{
      el.onclick = () => {
        state.importanceKnow = el.dataset.val;
        document.getElementById('knowOtherWrap').style.display = el.dataset.val==='Autre' ? 'block' : 'none';
        goTo(i);
      };
    });
    const ko = document.getElementById('knowOtherText');
    if(ko) ko.oninput = e => state.importanceKnowOther = e.target.value;
    const ci = document.getElementById('connaissancesInput');
    ci.oninput = () => { state.connaissances = parseInt(ci.value); document.getElementById('val_connaissances').textContent = ci.value; };
  }
  if(i===5){
    document.querySelectorAll('#choiceConsomme .choice').forEach(el=>{
      el.onclick = () => { state.consomme = el.dataset.val; render(); };
    });
    document.querySelectorAll('#choiceRaisons .choice').forEach(el=>{
      el.onclick = () => {
        toggleMulti(state.raisons, el.dataset.val);
        document.getElementById('raisonsOtherWrap').style.display = state.raisons.includes('Autre') ? 'block':'none';
        goTo(i);
      };
    });
    const ro = document.getElementById('raisonsOtherText');
    if(ro) ro.oninput = e => state.raisonsOther = e.target.value;
    document.querySelectorAll('#choiceTypes .choice').forEach(el=>{
      el.onclick = () => {
        toggleMulti(state.types, el.dataset.val);
        document.getElementById('typesOtherWrap').style.display = state.types.includes('Autre') ? 'block':'none';
        goTo(i);
      };
    });
    const to = document.getElementById('typesOtherText');
    if(to) to.oninput = e => state.typesOther = e.target.value;
  }
  if(i===6){
    document.querySelectorAll('#choiceAchat .choice').forEach(el=>{
      el.onclick = () => {
        state.achat = el.dataset.val;
        document.getElementById('achatOtherWrap').style.display = el.dataset.val==='Autre' ? 'block':'none';
        goTo(i);
      };
    });
    const ao = document.getElementById('achatOtherText');
    if(ao) ao.oninput = e => state.achatOther = e.target.value;
    document.querySelectorAll('#choiceBudgetCompl .choice').forEach(el=>{
      el.onclick = () => { state.budgetCompl = el.dataset.val; goTo(i); };
    });
    document.querySelectorAll('#choiceBudgetSoin .choice').forEach(el=>{
      el.onclick = () => { state.budgetSoin = el.dataset.val; goTo(i); };
    });
    const rem = document.getElementById('f_remarque');
    if(rem) rem.oninput = e => { state.remarque = e.target.value; };
  }

  const back = document.getElementById('btnBack');
  if(back) back.onclick = () => { stepIndex--; render(); };
  const next = document.getElementById('btnNext');
  if(next) next.onclick = () => {
    if(next.disabled) return;
    if(stepIndex < STEPS.length-1){ stepIndex++; render(); }
  };
}

function toggleMulti(arr, val){
  const idx = arr.indexOf(val);
  if(idx>-1) arr.splice(idx,1); else arr.push(val);
}

// Redessine juste les classes "selected" sans perdre le focus des champs texte
function goTo(i){
  const card = host.firstElementChild;
  card.innerHTML = STEPS[i]();
  wireStep(i);
}

/* ============================================================
   ANALYSE
   ============================================================ */
function buildAnalysis(){
  const entries = SCALE_ITEMS.map(it => [it, state.scores[it]]);
  const low = entries.filter(([,v]) => v <= 5).sort((a,b)=>a[1]-b[1]);
  const high = entries.filter(([,v]) => v >= 8);
  const avg = (entries.reduce((s,[,v])=>s+v,0)/entries.length).toFixed(1);

  let lines = [];
  lines.push(`RÉPONSES AU QUESTIONNAIRE — ${state.nom || "Participant"}`);
  lines.push(`Score de forme global : ${avg}/10 sur les 15 axes évalués.`);
  lines.push("");

  lines.push("AUTO-ÉVALUATION (détail) :");
  entries.forEach(([n,v]) => lines.push(`  • ${n} — ${v}/10`));
  lines.push("");

  if(low.length){
    lines.push(`Points d'attention (score ≤ 5) : ` + low.map(([n,v])=>`${n} (${v}/10)`).join(", ") + ".");
  }
  if(high.length){
    lines.push(`Points forts (score ≥ 8) : ` + high.map(([n,v])=>`${n} (${v}/10)`).join(", ") + ".");
  }
  lines.push("");

  if(state.genre === "Femme"){
    lines.push(`SANTÉ FÉMININE : ${state.phaseFemme === "Autre" ? "Autre — " + (state.phaseFemmeOther || "non précisé") : (state.phaseFemme || "non renseigné")}.`);
    lines.push("");
  }
  if(state.genre === "Homme"){
    lines.push(`SANTÉ MASCULINE : ${state.phaseHomme === "Autre" ? "Autre — " + (state.phaseHommeOther || "non précisé") : (state.phaseHomme || "non renseigné")}.`);
    lines.push("");
  }

  if(state.humeurType){
    lines.push(`HUMEUR AU QUOTIDIEN : ${state.humeurType}.`);
    lines.push("");
  }

  lines.push("Importance accordée à la santé : " + (state.importance || "non renseigné") + ".");
  lines.push("Connaissances en produits nutritionnels : " + state.connaissances + "/10.");
  lines.push("Comment le corps reçoit ses vitamines/minéraux : " + (state.importanceKnow || "non renseigné") +
    (state.importanceKnowOther ? " — " + state.importanceKnowOther : "") + ".");
  lines.push("");

  lines.push("Habitudes déclarées : consommation de compléments = " + (state.consomme||"non renseigné") +
    (state.raisons.length ? " (raisons : " + state.raisons.join(", ") + (state.raisonsOther ? " / " + state.raisonsOther : "") + ")" : "") + ".");
  if(state.types.length){
    lines.push("Types de produits utilisés : " + state.types.join(", ") + (state.typesOther ? " / " + state.typesOther : "") + ".");
  }
  lines.push("Lieu d'achat : " + (state.achat||"non renseigné") + (state.achatOther ? " — " + state.achatOther : "") + ".");
  lines.push("Budget mensuel foyer compléments : " + (state.budgetCompl||"non renseigné") +
    " · Budget soin de la peau : " + (state.budgetSoin||"non renseigné") + ".");
  lines.push("");

  lines.push("TRAITEMENT MÉDICAL EN COURS : " + (state.traitement || "non renseigné") +
    (state.traitement === "Oui" ? " — " + (state.traitementDetail || "détail non précisé") : ""));
  lines.push("");

  lines.push("Référent : " + (state.referent || "non renseigné"));

  if(state.remarque && state.remarque.trim()){
    lines.push("");
    lines.push("REMARQUE COMPLÉMENTAIRE :");
    lines.push(state.remarque.trim());
  }

  return lines.join("\n");
}

function renderResults(){
  const analysis = buildAnalysis();
  const entries = SCALE_ITEMS.map(it => [it, state.scores[it]]);
  const chips = entries.map(([n,v]) => `
    <div class="score-chip ${v<=5?'low':v>=8?'high':''}">
      <div class="cat">${n}</div>
      <div class="val">${v}/10</div>
    </div>`).join("");

  setTimeout(()=>{
    const btn = document.getElementById('btnSend');
    if(btn) btn.onclick = sendResults;
    const btnBack2 = document.getElementById('btnBackResults');
    if(btnBack2) btnBack2.onclick = () => { stepIndex--; render(); };
    const btnPdf = document.getElementById('btnPdf');
    if(btnPdf) btnPdf.onclick = generatePdf;
  },0);

  return `
    <div class="result-hero">
      <div class="glyph">🏔️</div>
      <h1 class="step-title">Votre analyse est prête</h1>
      <p class="step-sub">Voici votre synthèse personnalisée, prête à être envoyée par e-mail.</p>
    </div>
    <div class="score-summary">${chips}</div>
    <div class="analysis-block" id="analysisText">${analysis}</div>
    <div class="result-actions">
      <button class="btn-secondary" id="btnPdf">⬇ Télécharger en PDF</button>
      <button class="btn-primary" id="btnSend">Envoyer par e-mail →</button>
    </div>
    <div class="nav-row" style="margin-top:14px;">
      <button class="btn-ghost" id="btnBackResults">← Modifier</button>
      <span></span>
    </div>
    <div class="status-msg" id="statusMsg"></div>
  `;
}

/* ============================================================
   ENVOI (Formspree)
   ============================================================ */
async function sendResults(){
  const statusEl = document.getElementById('statusMsg');
  const btn = document.getElementById('btnSend');
  const analysis = document.getElementById('analysisText').textContent;

  if(FORMSPREE_ENDPOINT.includes("VOTRE_ID_ICI")){
    statusEl.className = "status-msg err";
    statusEl.textContent = "Endpoint Formspree non configuré — voir les instructions de mise en service.";
    return;
  }

  btn.disabled = true;
  statusEl.className = "status-msg";
  statusEl.textContent = "Envoi en cours…";

  const payload = {
    _subject: `Questionnaire Confort/Tonus/Nutrition — ${state.nom || "Nouveau participant"}`,
    nom: state.nom, age: state.age, email: state.email,
    metier: state.metier, whatsapp: state.whatsapp, referent: state.referent || "non renseigné",
    remarque_complementaire: state.remarque || "",
    traitement_en_cours: state.traitement + (state.traitement==='Oui' ? " — " + state.traitementDetail : ""),
    importance: state.importance,
    sante_feminine: state.genre === "Femme" ? (state.phaseFemme === "Autre" ? "Autre : " + (state.phaseFemmeOther||"") : state.phaseFemme) : "non renseigné",
    sante_masculine: state.genre === "Homme" ? (state.phaseHomme === "Autre" ? "Autre : " + (state.phaseHommeOther||"") : state.phaseHomme) : "non renseigné",
    humeur_quotidien: state.humeurType || "non renseigné",
    reponses_1_a_10: JSON.stringify(state.scores),
    connaissance_produits: state.connaissances,
    consomme_complements: state.consomme,
    raisons: state.raisons.join(", ") + (state.raisonsOther ? " / " + state.raisonsOther : ""),
    types_produits: state.types.join(", ") + (state.typesOther ? " / " + state.typesOther : ""),
    lieu_achat: state.achat + (state.achatOther ? " / " + state.achatOther : ""),
    budget_complements: state.budgetCompl,
    budget_soin_peau: state.budgetSoin,
    analyse_complete: analysis
  };

  try{
    const res = await fetch(FORMSPREE_ENDPOINT, {
      method:"POST",
      headers:{ "Content-Type":"application/json", "Accept":"application/json" },
      body: JSON.stringify(payload)
    });
    if(res.ok){
      statusEl.className = "status-msg ok";
      statusEl.textContent = "✓ Analyse envoyée avec succès à votre boîte mail.";
    } else {
      throw new Error("Réponse serveur non valide");
    }
  }catch(err){
    statusEl.className = "status-msg err";
    statusEl.textContent = "Échec de l'envoi. Vérifiez votre connexion, l'endpoint Formspree, et que vous avez bien validé l'e-mail de confirmation reçu lors du tout premier envoi.";
  }finally{
    btn.disabled = false;
  }
}

/* ============================================================
   EXPORT PDF (fichier réel, téléchargeable)
   ============================================================ */
function generatePdf(){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit:"mm", format:"a4" });
  const marginL = 18, marginR = 18, pageW = 210, usableW = pageW - marginL - marginR;
  let y = 20;

  const gold = [178,140,30];
  const dark = [26,32,44];
  const grey = [110,120,135];

  function checkPageBreak(neededSpace){
    if(y + neededSpace > 285){ doc.addPage(); y = 20; }
  }

  // En-tête
  doc.setFont("helvetica","bold");
  doc.setFontSize(18);
  doc.setTextColor(...dark);
  doc.text("Questionnaire Santé USANA — Confort, Tonus & Nutrition", marginL, y);
  y += 6;
  doc.setDrawColor(...gold);
  doc.setLineWidth(0.6);
  doc.line(marginL, y, pageW - marginR, y);
  y += 10;

  // Identité
  doc.setFont("helvetica","normal");
  doc.setFontSize(10.5);
  doc.setTextColor(...grey);
  const identLines = [
    `Participant : ${state.nom || "-"}   |   Âge : ${state.age || "-"}   |   Métier : ${state.metier || "-"}`,
    `E-mail : ${state.email || "-"}   |   WhatsApp : ${state.whatsapp || "-"}`,
    `Référent : ${state.referent || "non renseigné"}`,
    `Traitement en cours : ${state.traitement || "-"}${state.traitement==='Oui' ? " (" + (state.traitementDetail||"non précisé") + ")" : ""}`,
    `Date : ${new Date().toLocaleDateString('fr-FR')}`
  ];
  identLines.forEach(l => { doc.text(l, marginL, y); y += 5.5; });
  y += 4;

  // Scores
  checkPageBreak(20);
  doc.setFont("helvetica","bold");
  doc.setFontSize(12.5);
  doc.setTextColor(...dark);
  doc.text("Auto-évaluation (1 = tout va mal — 10 = tout va bien)", marginL, y);
  y += 7;

  doc.setFont("helvetica","normal");
  doc.setFontSize(10);
  const entries = SCALE_ITEMS.map(it => [it, state.scores[it]]);
  const colW = usableW / 2;
  entries.forEach((entry, idx) => {
    const [n, v] = entry;
    const col = idx % 2;
    const row = Math.floor(idx / 2);
    if(col === 0) checkPageBreak(6);
    const x = marginL + col * colW;
    const rowY = y + row * 6;
    if(v <= 5) doc.setTextColor(179,73,46); else if(v >= 8) doc.setTextColor(29,110,124); else doc.setTextColor(...dark);
    doc.text(`${n}`, x, rowY);
    doc.text(`${v}/10`, x + colW - 14, rowY);
  });
  y += Math.ceil(entries.length/2) * 6 + 8;
  doc.setTextColor(...dark);

  // Analyse complète
  checkPageBreak(14);
  doc.setFont("helvetica","bold");
  doc.setFontSize(12.5);
  doc.text("Détail des réponses", marginL, y);
  y += 7;

  doc.setFont("helvetica","normal");
  doc.setFontSize(9.8);
  doc.setTextColor(40,46,58);
  const analysis = buildAnalysis();
  const bodyLines = doc.splitTextToSize(analysis, usableW);
  bodyLines.forEach(line => {
    checkPageBreak(5.2);
    // légère mise en valeur des titres en majuscules
    if(/^[A-ZÀ-Ü :()\d/.,'’-]{6,}$/.test(line.trim()) && line.trim().length > 0 && line === line.toUpperCase()){
      doc.setFont("helvetica","bold");
      doc.setTextColor(...gold);
    } else {
      doc.setFont("helvetica","normal");
      doc.setTextColor(40,46,58);
    }
    doc.text(line, marginL, y);
    y += 5.2;
  });

  const filename = `Analyse_${(state.nom||"Participant").replace(/\s+/g,'_')}_USANA.pdf`;
  doc.save(filename);
}

render();
</script>
